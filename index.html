<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiving System 1.4 - أسواق فتح الله ماركت</title>
    <!-- مكتبة قراءة ملفات الإكسل SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #d35400;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
        }
        button {
            background-color: #d35400;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e67e22;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #444;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2c2c2c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Receiving System 1.4</h2>
    <p style="text-align: center; color: #aaa;">أسواق فتح الله ماركت - نظام استلام وتفريغ التحويلات</p>

    <div class="form-group">
        <label for="excelFile">اختر شيت الإكسل (إذن الصرف / التحويل) *</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
    </div>

    <div class="form-group">
        <label for="receiverName">اسم مسؤول الاستلام *</label>
        <input type="text" id="receiverName" value="عصام بدري">
    </div>

    <h3>الأصناف المستخرجة:</h3>
    <table id="itemsTable">
        <thead>
            <tr>
                <th>م</th>
                <th>كود الصنف</th>
                <th>اسم الصنف</th>
                <th>الكمية</th>
            </tr>
        </thead>
        <tbody id="itemsTableBody">
            <tr>
                <td colspan="4" style="color: #777;">لم يتم رفع أي شيت حتى الآن</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // دالة التعامل مع ملف الإكسل المرفوع
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // قراءة أول ورقة عمل في الشيت
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل الشيت إلى JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                
                // معالجة البيانات بالنسخة 1.4 المطورة
                processExcelData1_4(jsonData);
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء قراءة الملف، تأكد أنه ملف إكسل صالح.");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // المنطق البرمجي المحسّن للإصدار 1.4 (حل مشكلة عدم العثور على أصناف)
    function processExcelData1_4(jsonData) {
        if (!jsonData || !Array.isArray(jsonData) || jsonData.length === 0) {
            alert("الملف فارغ أو غير صالح للقراءة.");
            return;
        }

        let items = [];

        jsonData.forEach((row) => {
            if (!row || Object.keys(row).length === 0) return;

            let keys = Object.keys(row);
            
            // مرونة عالية في جلب الأعوام بغض النظر عن اختلاف المسميات
            let itemCode = row['كود الصنف'] || row['الكود'] || row['Code'] || row['code'] || row[keys[0]];
            let itemName = row['اسم الصنف'] || row['البيان'] || row['الاصناف'] || row['Name'] || row['name'] || row[keys[1]];
            let itemQty  = row['الكمية'] || row['العدد'] || row['Qty'] || row['qty'] || row[keys[2]];

            if (itemCode) itemCode = String(itemCode).trim();
            if (itemName) itemName = String(itemName).trim();
            if (itemQty)  itemQty  = String(itemQty).trim();

            // استبعاد صف العناوين أو الصفوف الوهمية
            if (itemCode && 
                itemCode !== "كود الصنف" && 
                itemCode !== "الكود" && 
                itemCode !== "code" && 
                itemCode !== "Code") {
                
                items.push({
                    code: itemCode,
                    name: itemName || "صنف بدون اسم",
                    qty: itemQty || 0
                });
            }
        });

        if (items.length === 0) {
            console.warn("Raw Data Read in v1.4:", jsonData);
            alert("تم قراءة الشيت، ولكن لم يتم العثور على أي أصناف مطابقة. تأكد من تطابق أعمدة الملف.");
        } else {
            console.log(`تم بنجاح استخراج ${items.length} صنف في Receiving System 1.4`);
            displayItemsTable(items);
        }
    }

    // دالة عرض الجدول في واجهة المستخدم
    function displayItemsTable(items) {
        let tableBody = document.getElementById('itemsTableBody');
        tableBody.innerHTML = '';
        
        items.forEach((item, idx) => {
            tableBody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${item.code}</td>
                    <td>${item.name}</td>
                    <td>${item.qty}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
