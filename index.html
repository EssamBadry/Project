<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receiving System 1.4 - أسواق فتح الله ماركت</title>
    <!-- مكتبة قراءة ملفات الإكسل SheetJS الحديثة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #d35400;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, button {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
        }
        button {
            background-color: #d35400;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e67e22;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid #444;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #2c2c2c;
            color: #d35400;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Receiving System 1.4</h2>
    <p style="text-align: center; color: #aaa;">أسواق فتح الله ماركت - نظام استلام وتفريغ التحويلات</p>

    <div class="form-group">
        <label for="excelFile">اختر شيت الإكسل (إذن الصرف / التحويل) *</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
    </div>

    <div class="form-group">
        <label for="receiverName">اسم مسؤول الاستلام *</label>
        <input type="text" id="receiverName" value="عصام بدري">
    </div>

    <h3>الأصناف المستخرجة:</h3>
    <table id="itemsTable">
        <thead>
            <tr>
                <th>م</th>
                <th>كود الصنف</th>
                <th>اسم الصنف</th>
                <th>الكمية</th>
            </tr>
        </thead>
        <tbody id="itemsTableBody">
            <tr>
                <td colspan="4" style="color: #777;">لم يتم رفع أي شيت حتى الآن</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                // قراءة الشيت بدعم شامل للملفات الثنائية والـ XLS القديمة
                const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل الشيت إلى مصفوفة صفوف (Array of Arrays) لضمان عدم ضياع أي صف حتى لو اختلفت العناوين
                const rawData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                
                processExcelData1_4(rawData);
            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء قراءة الملف، تأكد من صحة ملف الإكسل.");
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function processExcelData1_4(rows) {
        if (!rows || rows.length === 0) {
            alert("الملف فارغ تماماً.");
            return;
        }

        let items = [];
        let startIndex = 0;

        // البحث التلقائي عن صف الهيدر أو البدء المباشر في قراءة البيانات
        for (let i = 0; i < rows.length; i++) {
            let row = rows[i];
            // التحقق إذا كان الصف يحتوي على أعمدة دلالية أو بيانات معتبرة
            if (row && row.length > 0) {
                let textJoined = row.join(" ").toLowerCase();
                if (textJoined.includes("كود") || textJoined.includes("صنف") || textJoined.includes("كمية")) {
                    startIndex = i + 1; // البدء من الصف التالي لصف العناوين
                    break;
                }
            }
        }

        // إذا لم يتم العثور على هيدر صريح، نبدأ من الصف الأول
        let processingRows = startIndex > 0 ? rows.slice(startIndex - 1) : rows;

        processingRows.forEach((row) => {
            if (!row || row.length === 0) return;

            // استخراج الأعمدة بالترتيب الاحتياطي (الكود، الاسم، الكمية)
            let itemCode = row[0] !== undefined ? String(row[0]).trim() : "";
            let itemName = row[1] !== undefined ? String(row[1]).trim() : "";
            let itemQty  = row[2] !== undefined ? String(row[2]).trim() : "";

            // استبعاد صفوف العناوين المكررة أو الفارغة
            if (itemCode && 
                itemCode !== "كود الصنف" && 
                itemCode !== "الكود" && 
                itemCode !== "code" && 
                itemCode !== "Code" &&
                itemCode !== "م") {
                
                items.push({
                    code: itemCode,
                    name: itemName || "صنف بدون اسم",
                    qty: itemQty || 0
                });
            }
        });

        if (items.length === 0) {
            // محاولة قراءة بديلة بطريقة الـ Object إذا فشلت الطريقة التسلسلية
            console.warn("Retrying with object mapping...");
            processObjectMapping(rows);
        } else {
            console.log(`تم بنجاح استخراج ${items.length} صنف في Receiving System 1.4`);
            displayItemsTable(items);
        }
    }

    function processObjectMapping(rows) {
        // طريقة احتياطية إضافية لضمان قراءة أي شيت معقد
        let worksheet = XLSX.utils.aoa_to_sheet(rows);
        let jsonObjs = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
        let items = [];

        jsonObjs.forEach((row) => {
            let keys = Object.keys(row);
            if (keys.length === 0) return;

            let itemCode = row['كود الصنف'] || row['الكود'] || row['Code'] || row['code'] || row[keys[0]];
            let itemName = row['اسم الصنف'] || row['البيان'] || row['الاصناف'] || row['Name'] || row[keys[1]];
            let itemQty  = row['الكمية'] || row['العدد'] || row['Qty'] || row[keys[2]];

            if (itemCode) {
                itemCode = String(itemCode).trim();
                if (itemCode !== "كود الصنف" && itemCode !== "الكود") {
                    items.push({
                        code: itemCode,
                        name: itemName ? String(itemName).trim() : "صنف بدون اسم",
                        qty: itemQty !== undefined ? String(itemQty).trim() : 0
                    });
                }
            }
        });

        if (items.length === 0) {
            alert("تعذر العثور على أصناف في هذا الشيت، تأكد من أن الملف يحتوي على أعمدة للأكواد والكميات.");
        } else {
            displayItemsTable(items);
        }
    }

    function displayItemsTable(items) {
        let tableBody = document.getElementById('itemsTableBody');
        tableBody.innerHTML = '';
        
        items.forEach((item, idx) => {
            tableBody.innerHTML += `
                <tr>
                    <td>${idx + 1}</td>
                    <td>${item.code}</td>
                    <td>${item.name}</td>
                    <td>${item.qty}</td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
